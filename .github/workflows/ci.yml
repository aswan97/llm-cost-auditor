name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy strict)
        run: |
          if [ ! -d src ]; then
            echo "::notice::No src/ tree yet — skipping mypy. Remove this guard once the first module lands."
            exit 0
          fi
          mypy

      - name: Tests + coverage
        run: |
          if [ -z "$(find tests -name 'test_*.py' -print -quit 2>/dev/null)" ]; then
            echo "::notice::No tests yet — skipping. Remove this guard once the first module lands."
            exit 0
          fi
          pytest --cov=llm_cost_auditor --cov-report=term-missing --cov-fail-under=80

  price-literals:
    name: Price-literal guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for hard-coded prices
        run: python scripts/check_price_literals.py
