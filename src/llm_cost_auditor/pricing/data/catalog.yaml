  # Cache reads here are 0.025x input, not the 0.1x every other Anthropic row
  # uses. That is correct and deliberate, not a transcription slip: $0.25/MTok
  # against a $10.00/MTok input rate, agreed by all three feeds and confirmed
  # against the published figure on 2026-09-05.
  #
  # Left as a comment because the value looks wrong at a glance, and the obvious
  # "fix" — making it 0.1 like its siblings — would quadruple the cache-read
  # cost of every Fable 5.1 request and make prefix caching look four times less
  # worthwhile than it is. `test_fable_5_1_cache_reads_are_deliberately_off_pattern`
  # fails if anyone tidies it.
  - model: claude-fable-5-1
    provider: anthropic
    effective_from: 2026-09-01
    effective_to: null
    currency: USD
    units: per_mtok
    input: "10.00"
    output: "50.00"
    cache_read_multiplier: "0.025"
    cache_write_5m_multiplier: "1.25"
    cache_write_1h_multiplier: "2.0"
    batch_multiplier: "0.5"
    min_cacheable_tokens: 512
    max_breakpoints: 4
    tokenizer: Claude
    last_verified: 2026-09-05
    source_url: https://docs.anthropic.com/en/docs/about-claude/models/overview

