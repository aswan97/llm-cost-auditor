  # --- OpenAI (first-party) -------------------------------------------------
  # OpenAI's prompt caching is automatic and free to write, so the cache-write
  # multipliers are null rather than zero: there is no write to bill, and no
  # breakpoint to place. `min_cacheable_tokens` is null because no public feed
  # carries it; the automatic-cache threshold has to be read off OpenAI's own
  # caching page and verified before a cache analyzer can use it (see README).

  - model: gpt-5.5
    provider: openai
    effective_from: 2026-04-24
    effective_to: null
    currency: USD
    units: per_mtok
    input: "5.00"
    output: "30.00"
    cache_read_multiplier: "0.1"
    cache_write_5m_multiplier: null
    cache_write_1h_multiplier: null
    batch_multiplier: "0.5"
    min_cacheable_tokens: null
    max_breakpoints: null
    # Above 272k prompt tokens the whole request reprices: input 2x, output 1.5x.
    # models.dev still labels its key `context_over_200k`, but its own structured
    # `tiers` array says 272000 — matching LiteLLM and OpenRouter's
    # `min_prompt_tokens`. The stale key name is not the threshold.
    long_context:
      threshold_tokens: 272000
      input: "10.00"
      output: "45.00"
      cache_read_multiplier: "0.1"
      cache_write_5m_multiplier: null
      cache_write_1h_multiplier: null
    tokenizer: GPT
    last_verified: 2026-09-05
    source_url: https://platform.openai.com/docs/pricing

