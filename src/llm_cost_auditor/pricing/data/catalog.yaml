# The price table (SPEC.md §7.1). Data, never code — this file and the user's
# commercial overlay are the only places a monetary rate exists in the system.
#
# HOW THESE ROWS WERE PRODUCED
#
# Each rate was transcribed after agreeing across three independent public
# feeds — the LiteLLM catalog, models.dev, and OpenRouter. Every value below
# that appears in more than one of them matched exactly; none were averaged,
# and none were taken on a single source's word where a second was available.
# `source_url` points at the provider's own page, which is what a human checks
# against when bumping `last_verified` — the feeds are a cross-check and a
# drift alarm, never the authority (`llm-cost-auditor prices check`).
#
# Multipliers are derived, not transcribed: a provider publishes an absolute
# cache-read price, and the ratio to that row's own input rate is what goes
# here. That keeps a rate change from silently rewriting a discount.
#
# `null` means *not applicable to this model*, and is never a synonym for zero.
# A null multiplier makes a lookup fail loudly rather than price a token class
# the provider does not sell.

version: "2026-09-05"

rows:
  # --- Anthropic (first-party) ---------------------------------------------
  # Cache reads are 0.1x input and cache writes 1.25x (5m) / 2.0x (1h) across
  # the line, with one deliberate exception noted on claude-fable-5-1.

  - model: claude-opus-5
    provider: anthropic
    effective_from: 2026-07-24
    effective_to: null
    currency: USD
    units: per_mtok
    input: "5.00"
    output: "25.00"
    cache_read_multiplier: "0.1"
    cache_write_5m_multiplier: "1.25"
    cache_write_1h_multiplier: "2.0"
    batch_multiplier: "0.5"
    min_cacheable_tokens: 512
    max_breakpoints: 4
    tokenizer: Claude
    last_verified: 2026-09-05
    source_url: https://docs.anthropic.com/en/docs/about-claude/models/overview

