  # Still the most-deployed Sonnet, so it is priced even though newer rows exist.
  # It is also the only model here with a long-context tier: above 200k input
  # tokens Anthropic bills input, output, cache read and cache write at higher
  # rates. This row carries none of those, so `long_context_threshold_tokens`
  # makes a request above the boundary report as partially priced instead of
  # being quietly charged the base rate.
  - model: claude-sonnet-4-5
    provider: anthropic
    effective_from: 2025-09-29
    effective_to: null
    currency: USD
    units: per_mtok
    input: "3.00"
    output: "15.00"
    cache_read_multiplier: "0.1"
    cache_write_5m_multiplier: "1.25"
    cache_write_1h_multiplier: "2.0"
    batch_multiplier: "0.5"
    min_cacheable_tokens: 1024
    max_breakpoints: 4
    # Above 200k prompt tokens Anthropic reprices the whole request: input 2x and
    # output 1.5x, with the cache multipliers re-derived off the tiered input
    # rate. Confirmed identical across LiteLLM, models.dev and OpenRouter.
    long_context:
      threshold_tokens: 200000
      input: "6.00"
      output: "22.50"
      cache_read_multiplier: "0.1"
      cache_write_5m_multiplier: "1.25"
      cache_write_1h_multiplier: "2.0"
    tokenizer: Claude
    last_verified: 2026-09-05
    source_url: https://docs.anthropic.com/en/docs/about-claude/models/overview

