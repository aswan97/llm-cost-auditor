[project]
name = "llm-cost-auditor"
version = "0.1.0"
description = "Audits LLM provider API logs for caching, batching, and model-routing savings"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Runtime dependencies are added as the first modules land (SPEC.md §5.1).
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cost_auditor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
