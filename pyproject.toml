[project]
name = "llm-cost-auditor"
version = "0.1.0"
description = "Audits LLM provider API logs for caching, batching, and model-routing savings"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# SPEC.md §5.1. Cloud SDKs are optional extras, one per connector, so a
# local-files audit never pulls a cloud SDK it does not use.
dependencies = [
  "polars>=1.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "jinja2>=3.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# The web app (SPEC.md §13.1). Separate from the core so `ingest` in CI does
# not install a web server.
web = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
]
zstd = ["zstandard>=0.22"]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "types-pyyaml",
]

[project.scripts]
llm-cost-auditor = "llm_cost_auditor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cost_auditor"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Documentation code blocks are illustrative and rely on comment alignment for
# readability; the formatter would rewrite them. Docs are not linted or formatted.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["zstandard.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `tests/` is not a package; conftest helpers are imported by module name.
pythonpath = ["tests"]
